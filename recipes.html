<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>mkbody - レシピ集</title>
<style>
  :root {
    --bg: #faf9f6;
    --fg: #2b2b2b;
    --muted: #8a8a8a;
    --line: #e3e0d8;
    --head-bg: #f0eee8;
    --accent: #3a7d5c;
    --row-hover: #f3f1ea;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1e1e1c;
      --fg: #e8e6e0;
      --muted: #9a9892;
      --line: #3a3934;
      --head-bg: #2a2925;
      --accent: #6fbf94;
      --row-hover: #2e2d28;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font-family: "Hiragino Sans", "Noto Sans JP", sans-serif;
    line-height: 1.7;
  }
  header {
    padding: 1.5rem 1.25rem 0.5rem;
    max-width: 900px;
    margin: 0 auto;
  }
  h1 { margin: 0; font-size: 1.4rem; }
  h1 span { color: var(--accent); }
  nav.site { font-size: 0.85rem; margin-top: 0.25rem; }
  nav.site a { color: var(--accent); text-decoration: none; }
  nav.site a:hover { text-decoration: underline; }
  main {
    max-width: 900px;
    margin: 0 auto;
    padding: 0.75rem 1.25rem 3rem;
  }
  .tabs {
    display: flex;
    flex-wrap: wrap;
    gap: 0.4rem;
    margin: 0.75rem 0 1.25rem;
  }
  .tabs button {
    border: 1px solid var(--line);
    background: var(--head-bg);
    color: var(--fg);
    border-radius: 999px;
    padding: 0.35rem 0.9rem;
    font-size: 0.85rem;
    cursor: pointer;
    font-family: inherit;
  }
  .tabs button.active {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
  }
  article {
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 1.25rem 1.5rem;
  }
  article h1 { font-size: 1.3rem; margin: 0 0 0.5rem; }
  article h2 {
    font-size: 1.05rem;
    margin: 1.5rem 0 0.5rem;
    padding-bottom: 0.25rem;
    border-bottom: 1px solid var(--line);
  }
  article h3 { font-size: 0.95rem; margin: 1rem 0 0.3rem; color: var(--accent); }
  article ul, article ol { padding-left: 1.4rem; }
  article li { margin: 0.2rem 0; }
  article a { color: var(--accent); }
  .md-table-wrap { overflow-x: auto; }
  article table {
    border-collapse: collapse;
    font-size: 0.85rem;
    margin: 0.5rem 0;
  }
  article th, article td {
    border: 1px solid var(--line);
    padding: 0.35rem 0.7rem;
  }
  article th { background: var(--head-bg); }
  #status { color: var(--muted); font-size: 0.85rem; }
</style>
</head>
<body>
<header>
  <h1>mkbody <span>レシピ集</span></h1>
  <nav class="site"><a href="index.html">← 栄養素一覧に戻る</a></nav>
</header>
<main>
  <nav class="tabs" id="tabs"></nav>
  <div id="status">読み込み中...</div>
  <article id="content" hidden></article>
</main>
<script>
const RECIPES = [
  { id: 'low-temp-chicken', title: '低温調理鶏胸肉' },
  { id: 'pulled-pork', title: 'プルドポーク' },
  { id: 'pulled-beef', title: 'プルドビーフ' },
  { id: 'chicken-curry', title: '自家製チキンカレー' },
  { id: 'gyokai-tonkotsu-tsukejiru', title: '魚介豚骨つけ汁' },
];

// 依存なしの最小Markdownレンダラ。recipes/*.md で使う記法だけ対応する。
// 対応: 見出し(#〜###)、箇条書き、番号付きリスト、表、強調、リンク
function escapeHTML(s) {
  return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}
function inline(s) {
  return escapeHTML(s)
    .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
    .replace(/\[(.+?)\]\((.+?)\)/g, (m, text, href) =>
      `<a href="${href.replace(/\.md$/, '')}" data-md="${href}">${text}</a>`);
}
function renderMarkdown(md) {
  const lines = md.split(/\r?\n/);
  const out = [];
  let list = null; // 'ul' | 'ol'
  let table = null;
  const closeList = () => { if (list) { out.push(`</${list}>`); list = null; } };
  const closeTable = () => { if (table) { out.push('</table></div>'); table = null; } };

  for (const line of lines) {
    const t = line.trim();
    if (t.startsWith('|')) {
      closeList();
      const cells = t.split('|').slice(1, -1).map(c => c.trim());
      if (cells.every(c => /^-+$/.test(c))) continue; // 区切り行
      if (!table) { out.push('<div class="md-table-wrap"><table>'); table = 'head'; }
      const tag = table === 'head' ? 'th' : 'td';
      out.push('<tr>' + cells.map(c => `<${tag}>${inline(c)}</${tag}>`).join('') + '</tr>');
      if (table === 'head') table = 'body';
      continue;
    }
    closeTable();
    let m;
    if ((m = t.match(/^(#{1,3})\s+(.+)/))) {
      closeList();
      const level = m[1].length;
      out.push(`<h${level}>${inline(m[2])}</h${level}>`);
    } else if ((m = t.match(/^-\s+(.+)/))) {
      if (list !== 'ul') { closeList(); out.push('<ul>'); list = 'ul'; }
      out.push(`<li>${inline(m[1])}</li>`);
    } else if ((m = t.match(/^\d+\.\s+(.+)/))) {
      if (list !== 'ol') { closeList(); out.push('<ol>'); list = 'ol'; }
      out.push(`<li>${inline(m[1])}</li>`);
    } else if (t === '') {
      closeList();
    } else {
      closeList();
      out.push(`<p>${inline(t)}</p>`);
    }
  }
  closeList();
  closeTable();
  return out.join('\n');
}

const tabsEl = document.getElementById('tabs');
const statusEl = document.getElementById('status');
const contentEl = document.getElementById('content');

function load(id, push = true) {
  const recipe = RECIPES.find(r => r.id === id) || RECIPES[0];
  document.querySelectorAll('.tabs button').forEach(b =>
    b.classList.toggle('active', b.dataset.id === recipe.id));
  statusEl.hidden = false;
  statusEl.textContent = '読み込み中...';
  contentEl.hidden = true;
  fetch(`recipes/${recipe.id}.md`)
    .then(res => {
      if (!res.ok) throw new Error('HTTP ' + res.status);
      return res.text();
    })
    .then(md => {
      contentEl.innerHTML = renderMarkdown(md);
      statusEl.hidden = true;
      contentEl.hidden = false;
      if (push) history.replaceState(null, '', '#' + recipe.id);
    })
    .catch(err => {
      statusEl.textContent = '読み込みに失敗しました: ' + err.message;
    });
}

for (const r of RECIPES) {
  const b = document.createElement('button');
  b.textContent = r.title;
  b.dataset.id = r.id;
  b.addEventListener('click', () => load(r.id));
  tabsEl.appendChild(b);
}

// レシピ内のmdリンク（プルドポークと同じ手順 等）もタブ内遷移にする
contentEl.addEventListener('click', e => {
  const a = e.target.closest('a[data-md]');
  if (!a) return;
  const id = a.dataset.md.replace(/\.md$/, '');
  if (RECIPES.some(r => r.id === id)) {
    e.preventDefault();
    load(id);
  }
});

load(location.hash.slice(1) || RECIPES[0].id, false);
</script>
</body>
</html>
